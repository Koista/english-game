<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino English</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background: linear-gradient(#bfe9ff, #e6ffd9);
    color: #2d3a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    padding: 24px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 { margin: 0 0 8px; font-size: 32px; color: #2e8b57; }
  p { font-size: 20px; margin: 8px 0 20px; }
  .hidden { display: none !important; }

  button {
    font-family: inherit;
    font-size: 26px;
    border: none;
    border-radius: 18px;
    padding: 16px;
    cursor: pointer;
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }

  .levels { display: grid; gap: 14px; }
  .level-easy { background: #8fd694; color: #1f4d24; }
  .level-hard { background: #ffb36b; color: #5a2d00; }
  .level small { display: block; font-size: 16px; opacity: .8; }

  .top { display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
  .stars { font-size: 22px; letter-spacing: 2px; min-height: 30px; margin: 8px 0; }
  .picture { font-size: 130px; line-height: 1.1; margin: 10px 0; user-select: none; }
  .translation { font-size: 22px; min-height: 30px; color: #2e8b57; margin-bottom: 10px; }

  .options { display: grid; gap: 12px; }
  .option {
    display: flex;
    align-items: center;
    background: #fff5c2;
    color: #4a3b00;
    padding: 0;
    overflow: hidden;
  }
  .option .word { flex: 1; padding: 16px; }
  .option .say {
    font-size: 24px;
    padding: 16px 18px;
    background: rgba(0,0,0,.06);
    align-self: stretch;
    display: flex;
    align-items: center;
  }
  .option.right { background: #8fd694; color: #1f4d24; }
  .option.wrong { background: #ffb0b0; color: #7a1f1f; opacity: .6; }
  .option.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  .next { background: #6ec6ff; color: #003a5c; margin-top: 16px; width: 100%; }
  .again { background: #8fd694; color: #1f4d24; width: 100%; margin-top: 10px; }
  .change { background: #eee; color: #444; width: 100%; margin-top: 10px; font-size: 20px; }
  .big-stars { font-size: 34px; margin: 10px 0; }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="card">

  <!-- Выбор уровня -->
  <div id="start">
    <h1>🦖 Dino English 🦕</h1>
    <p>Учим английские слова про динозавров!<br>Выбери уровень:</p>
    <div class="levels">
      <button class="level level-easy" data-level="easy">🥚 Лёгкий<small>простые слова</small></button>
      <button class="level level-hard" data-level="hard">🌋 Сложный<small>слова посложнее</small></button>
    </div>
  </div>

  <!-- Игра -->
  <div id="game" class="hidden">
    <div class="top">
      <span id="counter">1 / 10</span>
      <span id="levelName"></span>
    </div>
    <div class="stars" id="stars"></div>
    <div class="picture" id="picture"></div>
    <div class="translation" id="translation"></div>
    <div class="options" id="options"></div>
    <button class="next hidden" id="next">Дальше ➡️</button>
  </div>

  <!-- Финал -->
  <div id="finish" class="hidden">
    <h1>🎉 Молодец! 🎉</h1>
    <p id="result"></p>
    <div class="big-stars" id="finalStars"></div>
    <button class="again" id="again">🔁 Ещё раз</button>
    <button class="change" id="change">Выбрать уровень</button>
  </div>

</div>

<script>
const WORDS = {
  easy: [
    { en: "dinosaur", ru: "динозавр", pic: "🦖" },
    { en: "egg",      ru: "яйцо",     pic: "🥚" },
    { en: "bone",     ru: "кость",    pic: "🦴" },
    { en: "tooth",    ru: "зуб",      pic: "🦷" },
    { en: "tree",     ru: "дерево",   pic: "🌳" },
    { en: "leaf",     ru: "лист",     pic: "🌿" },
    { en: "rock",     ru: "камень",   pic: "🪨" },
    { en: "fire",     ru: "огонь",    pic: "🔥" },
    { en: "sun",      ru: "солнце",   pic: "☀️" },
    { en: "nest",     ru: "гнездо",   pic: "🪺" },
    { en: "eye",      ru: "глаз",     pic: "👁️" },
    { en: "foot",     ru: "нога",     pic: "🦶" }
  ],
  hard: [
    { en: "volcano",   ru: "вулкан",    pic: "🌋" },
    { en: "skull",     ru: "череп",     pic: "💀" },
    { en: "footprint", ru: "след",      pic: "🐾" },
    { en: "meteor",    ru: "метеорит",  pic: "☄️" },
    { en: "lizard",    ru: "ящерица",   pic: "🦎" },
    { en: "crocodile", ru: "крокодил",  pic: "🐊" },
    { en: "turtle",    ru: "черепаха",  pic: "🐢" },
    { en: "palm tree", ru: "пальма",    pic: "🌴" },
    { en: "dragon",    ru: "дракон",    pic: "🐉" },
    { en: "wing",      ru: "крыло",     pic: "🪽" },
    { en: "mountain",  ru: "гора",      pic: "🏔️" },
    { en: "long neck", ru: "длинная шея", pic: "🦕" },
    { en: "shell",     ru: "ракушка",   pic: "🐚" },
    { en: "jungle",    ru: "джунгли",   pic: "🌿" }
  ]
};
const TOTAL = 10;

const $ = id => document.getElementById(id);
let level, questions, index, score, firstTry;

// ---------- Озвучка ----------
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  voice = voices.find(v => v.lang === "en-US") || voices.find(v => v.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  if (voice) u.voice = voice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

// ---------- Игра ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(screen) {
  ["start", "game", "finish"].forEach(id => $(id).classList.toggle("hidden", id !== screen));
}

function startGame(lvl) {
  level = lvl;
  questions = shuffle(WORDS[level]).slice(0, TOTAL);
  index = 0;
  score = 0;
  stopFireworks();
  $("levelName").textContent = level === "easy" ? "🥚 Лёгкий" : "🌋 Сложный";
  show("game");
  showQuestion();
}

function showQuestion() {
  const q = questions[index];
  firstTry = true;
  $("counter").textContent = `${index + 1} / ${TOTAL}`;
  $("stars").textContent = "⭐".repeat(score);
  $("picture").textContent = q.pic;
  $("translation").textContent = "";
  $("next").classList.add("hidden");

  const others = shuffle(WORDS[level].filter(w => w.en !== q.en)).slice(0, 2);
  const options = shuffle([q, ...others]);

  const box = $("options");
  box.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="word"></span><span class="say" title="Послушать">🔊</span>`;
    btn.querySelector(".word").textContent = opt.en;
    btn.addEventListener("click", e => {
      if (e.target.classList.contains("say")) { say(opt.en); return; }
      choose(btn, opt, q);
    });
    box.appendChild(btn);
  });
}

function choose(btn, opt, q) {
  if (btn.classList.contains("wrong") || !$("next").classList.contains("hidden")) return;

  if (opt.en === q.en) {
    btn.classList.add("right");
    if (firstTry) score++;
    $("stars").textContent = "⭐".repeat(score);
    $("translation").textContent = `${q.en} — ${q.ru}`;
    say(q.en);
    $("next").classList.remove("hidden");
  } else {
    firstTry = false;
    btn.classList.add("wrong", "shake");
    say(opt.en);
  }
}

function nextQuestion() {
  index++;
  if (index < TOTAL) showQuestion();
  else finish();
}

function finish() {
  show("finish");
  $("result").textContent = `Ты набрал ${score} из ${TOTAL} звёздочек!`;
  $("finalStars").textContent = "⭐".repeat(score) || "🦕";
  say(score >= 7 ? "Great job!" : "Well done!");
  startFireworks();
}

document.querySelectorAll(".level").forEach(b =>
  b.addEventListener("click", () => startGame(b.dataset.level)));
$("next").addEventListener("click", nextQuestion);
$("again").addEventListener("click", () => startGame(level));
$("change").addEventListener("click", () => { stopFireworks(); show("start"); });

// ---------- Салют ----------
const canvas = $("fireworks");
const ctx = canvas.getContext("2d");
let particles = [], fwTimer = null, fwFrame = null;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function burst() {
  const x = canvas.width * (0.15 + Math.random() * 0.7);
  const y = canvas.height * (0.15 + Math.random() * 0.4);
  const hue = Math.floor(Math.random() * 360);
  for (let i = 0; i < 70; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color: `hsl(${hue + Math.random() * 40}, 100%, 60%)`
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06;
    p.vx *= 0.98;
    p.life -= 0.012;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
  fwFrame = requestAnimationFrame(draw);
}

function startFireworks() {
  stopFireworks();
  burst();
  fwTimer = setInterval(burst, 600);
  setTimeout(() => clearInterval(fwTimer), 6000);
  draw();
}

function stopFireworks() {
  clearInterval(fwTimer);
  cancelAnimationFrame(fwFrame);
  particles = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
